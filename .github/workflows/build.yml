name: Build APK et site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Vérifier le SDK Android
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME
      - name: Installer les dépendances
        run: npm install
      - name: Générer le projet Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Icônes de l'appli
        run: |
          sudo apt-get install -y -qq imagemagick >/dev/null
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=android/app/src/main/res/mipmap-${d%%:*}
            mkdir -p $dir
            convert www/icons/icon-512.png -resize ${d##*:}x${d##*:} $dir/ic_launcher.png
            cp $dir/ic_launcher.png $dir/ic_launcher_round.png
            convert www/icons/icon-512.png -resize ${d##*:}x${d##*:} $dir/ic_launcher_foreground.png
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Arsenal-BF6.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Arsenal-BF6-apk
          path: Arsenal-BF6.apk
      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Arsenal BF6 (dernière version)
          body: APK Android à télécharger et installer sur le téléphone.
          files: Arsenal-BF6.apk
          make_latest: true

  pages:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
